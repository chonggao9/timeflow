这是「洞察 > 行程」合并页的【视觉与交互参考】，不是要交付的代码。
- 请用项目现有技术栈原生实现，不要照搬本文件的 DOM 结构或 CSS。
- 本文件里的数据全是示例（见底部 DATA），实际请接入现有统计与历史查询。

设计令牌 Design tokens
  背景 bg        #FBF4EE      卡片 card      #FFFFFF
  文字 ink       #2A2220      次要文字 muted  #766A64
  主色 accent    #C62F35      图表高亮 mid    #EF5350
  浅主色 soft    #FDE8E6      图表弱化色      #F6BDB6 / #F2A39B
  分割线 line    #F3EAE4      无数据柱色      #F0E6DE
  卡片圆角 20 / 小卡 16 / chip 22(胶囊) / 页面左右边距 16 / 卡片间距 14
  触控区域 >= 44px

页面结构（自上而下）
  页头 → Tab(行程/专注) → 三个统计卡 → 近7天出行 → 路线洞察
  → 未命名地点提示 → 出行记录(搜索 + 方式筛选 + 按日分组列表) → 底部导航
  另有「行程详情」页（点"查看最近一次"进入）

交互
  - 路线 chips：只切换"路线洞察"卡片
  - 方式 chips + 搜索：只过滤"出行记录"列表，无结果显示空状态
  - 样本数 < 2 的路线：不显示大字耗时的"通常"含义，改提示"样本不足"

<style>
:root{--bg:#FBF4EE;--card:#fff;--ink:#2A2220;--muted:#766A64;--accent:#C62F35;--mid:#EF5350;--soft:#FDE8E6;--line:#F3EAE4;--shadow:0 2px 10px rgba(120,70,50,.07)}
*{box-sizing:border-box}
html{background:#E9DFD7}
body{margin:0;font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
.body{flex:1;padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.muted{color:var(--muted);font-size:12px}
.pill-btn{min-height:44px;padding:0 12px;border:1px solid #EADFD7;background:#fff;border-radius:22px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;padding:4px;background:#F3E9E1;border-radius:16px}
.tabs button{flex:1;min-height:44px;border:none;border-radius:12px;background:transparent;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 1px 4px rgba(120,70,50,.12)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.week{display:flex;gap:6px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbar{height:76px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.wbar i{display:block;width:100%;max-width:26px;border-radius:6px}
.share{display:flex;gap:3px}
.share i{height:10px;border-radius:5px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#4A3F3A}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:9px;height:9px;border-radius:3px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;font-size:13px;background:#fff;border:1.5px solid #EADFD7;color:#4A3F3A}
.chip.on{background:var(--soft);border-color:var(--mid);color:#9E2429;font-weight:700}
.rchip{flex:none;min-height:44px;padding:4px 14px;border-radius:22px;background:#fff;border:1.5px solid #EADFD7;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;white-space:nowrap;text-align:left}
.rchip.on{background:var(--soft);border-color:var(--mid);color:#9E2429}
.rchip b{font-size:13px}.rchip small{font-size:11px;opacity:.8}
.big{display:flex;align-items:baseline;gap:4px;color:var(--accent)}
.big b{font-size:44px;font-weight:800;line-height:1.1}.big span{font-size:16px;font-weight:700}
.tip{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:#4A3F3A;line-height:1.5}

.bars{display:flex;align-items:flex-end}

.axis{display:flex;font-size:11px;color:var(--muted);margin-top:6px}
.banner{background:var(--soft);border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner button{flex:none;min-height:44px;padding:0 16px;border:none;border-radius:22px;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;background:#fff;border-radius:22px;box-shadow:var(--shadow)}

.day{display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.day-h b{font-size:13px;color:#4A3F3A}
.list{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.trip{display:flex;align-items:center;gap:12px;padding:10px 12px}
.trip+.trip{border-top:1px solid var(--line)}
.ico{flex:none;width:36px;height:36px;border-radius:18px;background:#FDEDEA;color:var(--accent);display:flex;align-items:center;justify-content:center}
.tmid{flex:1;min-width:0}
.tmid b{font-size:15px}
.badge{font-size:11px;color:var(--accent);background:#FDEDEA;border-radius:8px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.tmid div{font-size:12px;color:var(--muted);margin-top:3px}

.nav{flex:none;height:64px;background:#fff;border-top:1px solid #F0E6DE;display:flex;position:sticky;bottom:0}
.nav button{flex:1;border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
.nav button.on{color:var(--accent);font-weight:700}
.link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;min-height:44px}
.top{display:flex;align-items:center;gap:4px;padding:12px 16px 0}

.tl .cont{flex:1;padding-bottom:14px}
.tl .cont .r1{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.tl .cont .r1 span{color:var(--muted);font-weight:400}
.cmp{display:flex;align-items:center;gap:10px;font-size:12px}

.cmp .tr i{display:block;height:12px;border-radius:6px}.cmp .v{width:44px;text-align:right;color:var(--muted)}
.cmp.cur .t,.cmp.cur .v{color:var(--ink);font-weight:700}
.actions{display:flex;gap:10px}
.actions button{flex:1;min-height:48px;border-radius:24px;font-size:14px;font-weight:700}
.actions .p{border:none;background:var(--accent);color:#fff}
.actions .s{border:1.5px solid #EADFD7;background:#fff;color:var(--ink);font-weight:600}
</style>
</head>

    var h=d.m>0?Math.max(6,Math.round(d.m/48*52)):3;
    var c=d.m===0?'#F0E6DE':(today?'#C62F35':'#F2A39B');
    return '<div class="wcol"><div class="wbar"><span>'+(d.m||'')+'</span><i style="height:'+h+'px;background:'+c+'"></i></div><span style="font-size:11px;color:'+(today?'#C62F35':'#766A64')+';font-weight:'+(today?700:400)+'">'+d.l+'</span></div>';
  }).join('');
  $('weekTotal').textContent=Math.floor(total/60)+' 小时 '+(total%60)+' 分';
  $('share').innerHTML=SHARES.map(function(x){return '<i style="flex:'+x.p+' 1 0;background:'+x.c+'"></i>'}).join('');
  $('legend').innerHTML=SHARES.map(function(x){return '<span><em style="background:'+x.c+'"></em>'+x.n+' '+x.p+'%</span>'}).join('');
}
function renderRoute(){
  $('routeChips').innerHTML=ROUTES.map(function(r,i){
    return '<button class="rchip'+(i===S.route?' on':'')+'" data-i="'+i+'"><b>'+r.name+'</b><small>'+r.mode+'</small></button>';
  }).join('');
  var r=ROUTES[S.route], low=r.sample<2;
  $('routeBody').innerHTML=
   '<div class="row" style="align-items:flex-end"><div><div class="muted">'+(low?'参考耗时':'通常耗时')+'</div>'+
   '<div class="big"><b>'+r.typical+'</b><span>分钟</span></div><div class="muted">'+r.transfer+'</div></div>'+
   '<div class="muted" style="text-align:right;line-height:1.7"><div>波动 <b style="color:var(--ink)">'+r.range+'</b></div><div>样本 <b style="color:var(--ink)">'+r.sample+' 次</b></div><div>通常出发 <b style="color:var(--ink)">'+r.hour+'</b></div></div></div>'+
   (r.note?'<div class="tip">'+r.note+'</div>':'')+
   (low?'<div class="tip gray">样本不足：再走几次，耗时规律会更准。</div>':'')+
   '<div><div class="chart-t">耗时分布（分钟）</div><div class="bars" style="height:64px;gap:6px">'+bars(r.dist,64)+'</div><div class="axis" style="gap:6px">'+r.labels.map(function(t){return '<span style="flex:1;text-align:center">'+t+'</span>'}).join('')+'</div></div>'+
   '<div><div class="chart-t">通常出发时段</div><div class="bars" style="height:56px;gap:2px">'+bars(r.hours,56)+'</div><div class="axis" style="justify-content:space-between"><span>0</span><span>6</span><span>12</span><span>18</span><span>24 时</span></div></div>'+
   '<div><div class="chart-t">近 8 周趋势</div><div class="bars" style="height:56px;gap:6px">'+bars(r.weeks,56)+'</div><div class="axis" style="justify-content:space-between"><span>8 周前</span><span>本周</span></div></div>';
}
function renderModes(){
  $('modeChips').innerHTML=MODES.map(function(m){return '<button class="chip'+(m===S.mode?' on':'')+'" data-m="'+m+'">'+m+'</button>'}).join('');
}
function renderList(){
  var n=0, html='';
  DAYS.forEach(function(d){
    var list=d.t.filter(function(t){return (S.mode==='全部'||t.m===S.mode)&&(!S.q||t.n.indexOf(S.q)>-1)});
    if(!list.length) return; n+=list.length;
    html+='<div class="day"><div class="day-h"><b>'+d.l+'</b><span class="muted">'+d.s+'</span></div><div class="list">'+
    list.map(function(t){
      var right = t.dur ? '<b>'+t.dur+'</b><small>'+(t.note||'')+'</small>'
                : (t.n==='未命名' ? '<button class="name-btn">命名</button>' : '<span style="font-size:15px;color:var(--muted)">—</span>');
      return '<div class="trip"><div class="ico">'+svg(t.m,20)+'</div><div class="tmid"><b>'+t.n+'</b>'+(t.found?'<span class="badge">已发现路线</span>':'')+'<div>'+t.meta+'</div></div><div class="tright">'+right+'</div></div>';
    }).join('')+'</div></div>';
  });
  $('days').innerHTML=html||'<div class="empty">没有符合条件的记录</div>';
  $('count').textContent=n+' 条';
}
function renderTimeline(){
  $('timeline').innerHTML=STOPS.map(function(s){
    var dot=s.first?'background:#C62F35':(s.last?'background:#2A2220':'background:#fff;border:2.5px solid #C62F35');
    return '<div class="tl"><div class="rail"><div class="dot" style="'+dot+'"></div>'+(s.last?'':'<div class="ln"></div>')+'</div><div class="cont"><div class="r1"><span style="color:var(--ink);font-weight:700">'+s.n+'</span><span>'+s.t+'</span></div>'+
      (s.seg?'<div class="row" style="align-items:center;margin-top:2px"><span class="muted">'+s.seg+'</span>'+(s.name?'<button class="link" style="font-size:12px">命名</button>':'')+'</div>':'')+'</div></div>';
  }).join('');
}
function go(v){
  $('v-main').classList.toggle('on',v==='main');
  $('v-detail').classList.toggle('on',v==='detail');
  window.scrollTo(0,0);
}

$('routeChips').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(b){S.route=+b.dataset.i;renderRoute()}});
$('modeChips').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(b){S.mode=b.dataset.m;renderModes();renderList()}});
$('q').addEventListener('input',function(e){S.q=e.target.value.trim();renderList()});

renderWeek();renderRoute();renderModes();renderList();renderTimeline();
</script>
</body>
</html>
